<!doctype html><html lang="en"><meta charset="utf-8"><title>GlionIQ phase two browser QA</title><style>body{font:16px system-ui;margin:24px;background:#e8edf4;color:#102236}iframe{width:100%;height:760px;border:1px solid #446}pre{white-space:pre-wrap}#runner{position:absolute;left:-10000px;width:1440px;visibility:hidden}button{padding:12px}</style><h1>GlionIQ phase two browser QA</h1><p id="status">Running local tests…</p><pre id="results"></pre><h2>Responsive visual preview</h2><select id="page"><option value="/">Homepage</option><option value="/laboratories/neurobreath/">NeuroBreath</option><option value="/admin/">Editorial Studio</option><option value="/preview/blog/">Blog template</option><option value="/preview/science/">Science template</option></select><select id="width"><option>320</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option></select><button id="show">Show</button><div id="view"></div><iframe id="runner" title="Local browser test runner"></iframe><script>
if(!['127.0.0.1','localhost'].includes(location.hostname))throw Error('Local only');
const results=[],qaStatus=document.querySelector('#status'),out=document.querySelector('#results'),frame=document.querySelector('#runner');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function check(ok,label){results.push({status:ok?'PASS':'FAIL',label});out.textContent=results.map(r=>r.status+' · '+r.label).join('\n');qaStatus.textContent=(ok?'Running: ':'FAILED: ')+results.length+' checks · '+label;if(!ok)throw Error(label);}
async function load(url,width){frame.style.width=width+'px';const done=new Promise(resolve=>frame.onload=resolve);frame.src=url+(url.includes('?')?'&':'?')+'qa='+Date.now();await done;const page=frame.contentDocument;[...page.images].forEach(image=>image.loading='eager');await Promise.all([...page.images].map(image=>image.decode()));await sleep(80);return page;}
async function until(test){for(let n=0;n<80;n++){if(test())return;await sleep(50);}throw Error('Timed out waiting for UI');}
document.querySelector('#show').onclick=()=>{const view=document.querySelector('#view');view.replaceChildren();const f=document.createElement('iframe');f.style.width=document.querySelector('#width').value+'px';f.src=document.querySelector('#page').value;f.title='Selected responsive preview';view.append(f);};
(async()=>{
 if(!new URLSearchParams(location.search).has('lifecycle')){
 const searchPage=await load('/search/',390);
 check(searchPage.querySelector('#query').placeholder==='Search GlionIQ laboratories, platforms and research…','Exact search placeholder: '+JSON.stringify(searchPage.querySelector('#query').placeholder));
 check(searchPage.querySelector('#search-status').textContent==='Discover our platforms, laboratories and scientific insights.','Exact empty-state helper after JavaScript initialization');

 for(const width of [320,390,768,1024,1440]){
  let d=await load('/',width);let w=frame.contentWindow;
  const cards=[...d.querySelectorAll('[data-platform]')],heights=cards.map(c=>c.getBoundingClientRect().height);
  check(cards.map(c=>c.dataset.platform).join(',')==='trampolina,dr-quiz,neuropath,neurobreath','Four approved cards in order at '+width);
  check(Math.max(...heights)-Math.min(...heights)<2,'Equal main card heights at '+width);
  check(!d.querySelector('#laboratory-panel'),'No appended homepage tree at '+width);
  for(const key of ['trampolina','dr-quiz','neuropath','neurobreath']){
   d=frame.contentDocument;
   const card=d.querySelector('[data-platform="'+key+'"]');
   check(card.querySelector('.gold-button').pathname==='/laboratories/'+key+'/','Existing Explore destination: '+key);
   card.querySelector('.laboratory-toggle').click();await until(()=>d.querySelector('[data-central-tree]')?.dataset.centralTree===key);
   check(d===frame.contentDocument&&new URL(w.location.href).searchParams.get('laboratory')===key,'Discover replaces cards in place: '+key+' at '+width);
   check(d.querySelector('.platform-grid').hidden&&d.querySelectorAll('.platform-card').length===4&&d.querySelectorAll('.tree-branch').length>=3,'Selected tree replaces the preserved four-card grid');
   check(d.activeElement===d.querySelector('.tree-root h3')&&d.querySelectorAll('h1').length===1,'Explorer heading receives focus; homepage keeps one H1');
   check(d.documentElement.scrollWidth<=frame.contentWindow.innerWidth,'Tree fits '+width);
   d.querySelector('[data-close-explorer]').click();await until(()=>!d.querySelector('[data-central-tree]'));
   check(!d.querySelector('.platform-grid').hidden&&d.activeElement===card.querySelector('.laboratory-toggle'),'Close restores four cards and initiating focus: '+key);
  }
 }
 check(true,'All four in-place Discover and Close actions at five widths');
 for(const key of ['trampolina','dr-quiz','neuropath','neurobreath']){
  const deep=await load('/?laboratory='+key,390);await until(()=>deep.querySelector('[data-central-tree]')?.dataset.centralTree===key);
  check(deep.querySelector('.platform-grid').hidden,'Deep-link reload restores selected '+key+' tree');
 }
 for(const route of ['/laboratories/trampolina/numbers/','/laboratories/dr-quiz/discover-learn/wine/italy/piedmont/barolo/','/laboratories/neuropath/logic/codequest/','/laboratories/neurobreath/square-focus/']){
  const page=await load(route,390),parent=page.querySelector('[data-parent-link]');
  check(!!parent&&page.querySelector('.catalogue-breadcrumbs [aria-current="page"]'),'Hierarchical breadcrumb and explicit Back: '+route);
  const details=page.querySelector('.catalogue-disclosure');details.querySelector('summary').click();check(details.open,'Accessible details expand: '+route);
  details.querySelector('summary').click();check(!details.open,'Accessible details collapse: '+route);
  check(page.querySelectorAll('#tutorial li').length>=3,'Meaningful tutorial: '+route);
  const destination=parent.pathname,arrived=new Promise(resolve=>frame.onload=resolve);parent.click();await arrived;
  check(frame.contentWindow.location.pathname===destination,'Back reaches actual parent: '+route);
 }
 const orbPage=await load('/laboratories/neurobreath/explore/',1440),orb=orbPage.querySelector('.living-orb'),orbWindow=frame.contentWindow;
 const animations=orb.getAnimations({subtree:true});
 // The hidden test runner is offscreen: test idle behavior by making its own
 // observer see a viewport intersection, then exercise the renderer directly.
 orb.removeAttribute('data-dormant');
 const beforeTime=animations.map(a=>a.currentTime);await sleep(180);
 check(animations.length>=3&&animations.some((a,i)=>a.currentTime>beforeTime[i]),'Original orb has gentle idle and independent arm-layer animations');
 for(const [time,expected] of [[0,.94],[4000,1.06],[8000,1.06],[12000,.94]]){
  orbWindow.renderBreathingOrb(orb,orbWindow.breathingSnapshot('square-focus',time));
  check(Math.abs(Number(orb.style.getPropertyValue('--orb-scale'))-expected)<.001,'Active orb phase size at '+time+'ms');
 }
 orbWindow.renderBreathingOrb(orb,orbWindow.breathingSnapshot('square-focus',2000),true);
 check(orb.style.getPropertyValue('--orb-scale')==='1'&&orb.style.getPropertyValue('--arm-shift')==='0px','Reduced-motion renderer disables transform movement');
 check([...orb.querySelectorAll('img')].every(i=>i.getAttribute('src')==='/public/images/neurobreath-logo-official.jpg'),'All orb layers use the unchanged original');
 // Keep the test viewport geometrically on screen for visibility-pausing tests.
 frame.style.position='fixed';frame.style.left='0';frame.style.top='0';
 for(const [method,duration,expectedPhases] of [['square-focus',16,['Inhale','Hold','Exhale','Hold']],['sleep-calm',12,['Inhale','Hold','Exhale']],['neural-wave',10,['Inhale','Exhale']]]){
  const page=await load('/laboratories/neurobreath/'+method+'/',390),root=page.querySelector('[data-breathing]');
  const start=root.querySelector('[data-action="start"]'),pause=root.querySelector('[data-action="pause"]'),restart=root.querySelector('[data-action="restart"]');
  check(!start.disabled&&pause.disabled&&restart.disabled,'Ready controls: '+method);
  start.click();await sleep(180);check(root.dataset.state==='running'&&root.querySelector('.current-phase').textContent==='Inhale','Start '+method);
  pause.click();const frozen=root.querySelector('.living-orb').style.cssText,count=root.querySelector('[data-countdown]').textContent;await sleep(220);
  check(root.dataset.state==='paused'&&start.textContent==='Resume'&&root.querySelector('.living-orb').style.cssText===frozen&&root.querySelector('[data-countdown]').textContent===count,'Pause preserves animation and countdown: '+method);
  start.click();await sleep(100);check(root.dataset.state==='running','Resume '+method);
  restart.click();const began=performance.now(),seen=[];
  while(root.querySelector('[data-cycle]').textContent==='1'&&performance.now()-began<(duration+2)*1000){
   const step=page.querySelector('.exercise-steps li[data-current]');const index=[...page.querySelectorAll('.exercise-steps li')].indexOf(step);
   if(seen.at(-1)?.index!==index)seen.push({index,phase:root.querySelector('.current-phase').textContent,time:Math.round(performance.now()-began)});
   await sleep(60);
  }
  check(root.querySelector('[data-cycle]').textContent==='2','Real-time complete cycle: '+method+' '+Math.round(performance.now()-began)+'ms');
  check(seen.filter(s=>s.time<duration*1000-100).map(s=>s.phase).join(',')===expectedPhases.join(','),'Real-time phase order: '+method+' '+JSON.stringify(seen));
  pause.click();check(!start.disabled&&pause.disabled&&!restart.disabled,'Pause control accessibility: '+method);
  const exited=new Promise(resolve=>frame.onload=resolve);root.querySelector('.exit-activity').click();await exited;
  check(frame.contentDocument.querySelector('[data-central-tree]')?.dataset.centralTree==='neurobreath','Exit returns to NeuroBreath tree: '+method);
 }
 }
 frame.style.position='fixed';frame.style.left='0';frame.style.top='0';
 const lifecyclePage=await load('/laboratories/neurobreath/square-focus/',390),lifecycleWindow=frame.contentWindow,lifecycle=lifecyclePage.querySelector('[data-breathing]');
 lifecycle.querySelector('[data-action="start"]').click();await sleep(130);
 Object.defineProperty(lifecyclePage,'hidden',{configurable:true,value:true});lifecyclePage.dispatchEvent(new lifecycleWindow.Event('visibilitychange'));
 check(lifecycle.dataset.state==='paused'&&lifecycle.querySelector('.session-note').textContent.includes('hidden'),'Visibility event pauses the clock');
 delete lifecyclePage.hidden;lifecyclePage.dispatchEvent(new lifecycleWindow.Event('visibilitychange'));
 check(lifecycle.dataset.state==='paused','Returning visibility requires explicit Resume');
 const reduceRules=[...lifecyclePage.styleSheets].flatMap(sheet=>[...sheet.cssRules]).filter(rule=>rule.conditionText?.includes('prefers-reduced-motion: reduce')).map(rule=>[...rule.cssRules].map(r=>r.cssText).join('')).join('');
 const forced=new lifecycleWindow.CSSStyleSheet();forced.replaceSync(reduceRules);lifecyclePage.adoptedStyleSheets=[...lifecyclePage.adoptedStyleSheets,forced];
 check(lifecycleWindow.getComputedStyle(lifecycle.querySelector('.orb-body')).animationName==='none'&&lifecycleWindow.getComputedStyle(lifecycle.querySelector('.orb-arms')).transform==='none','Reduced-motion stylesheet rules suppress idle and arm movement (forced-rule test)');
 lifecyclePage.adoptedStyleSheets=lifecyclePage.adoptedStyleSheets.filter(sheet=>sheet!==forced);
 lifecycle.querySelector('[data-action="start"]').click();
 const exitedAgain=new Promise(resolve=>frame.onload=resolve);lifecycle.querySelector('.exit-activity').click();await exitedAgain;
 check(lifecycle.dataset.state==='ready'&&lifecycle.querySelector('[data-action="start"]').textContent==='Start','Exit resets the cached guide to ready; native history is checked separately');
 frame.style.position='absolute';frame.style.left='-10000px';
 if(new URLSearchParams(location.search).get('editorial')==='1'){
 const d=await load('/admin/',1440),w=frame.contentWindow,form=d.querySelector('#article-form'),f=n=>form.elements.namedItem(n),slug='browser-qa-'+Date.now();
 const values={title:'Local browser test — unpublished',slug,author:'QA fixture',summary:'Temporary local draft used to verify the editor. Not a published article.',body:'## A clear heading\n\nA **bold** idea and *gentle* emphasis.\n\n<script>window.unsafeExecuted=true;<\/script>',category:'Local QA'};
 for(const [name,value] of Object.entries(values)){f(name).value=value;f(name).dispatchEvent(new w.Event('input',{bubbles:true}));}f('slug').value=slug;
 form.requestSubmit();await until(()=>d.querySelector('#editor-status').textContent.includes('Draft saved'));
 check(true,'Browser editor creates a local draft');
 f('title').value='Local browser test — edited';d.querySelector('#review-article').click();await until(()=>d.querySelector('#editor-status').textContent.includes('Marked for owner review'));check(true,'Browser edit and review save');
 d.querySelector('#preview-article').click();await until(()=>!d.querySelector('#preview-section').hidden);const pf=d.querySelector('#article-preview');await until(()=>pf.contentDocument?.querySelector('.article-page'));
 check(pf.contentDocument.querySelector('h1').textContent==='Local browser test — edited','Preview uses edited title');check(!pf.contentWindow.unsafeExecuted,'Pasted HTML does not execute');check(pf.contentDocument.querySelector('.preview-banner').textContent.includes('Not published'),'Preview visibly unpublished');check(!!pf.contentDocument.querySelector('strong')&&!!pf.contentDocument.querySelector('em'),'Markdown emphasis rendered');
 check(d.querySelector('#draft-list').textContent.includes('Local browser test — edited'),'Draft appears in local list');
 d.querySelector('#new-article').click();const saved=[...d.querySelectorAll('.draft-button')].find(b=>b.textContent.includes('Local browser test — edited'));saved.click();await until(()=>f('title').value==='Local browser test — edited');check(f('body').value.includes('**bold**'),'Saved draft reopens with content');
 for(const width of [320,390,768,1024,1440]){
  for(const route of ['/admin/','/preview/blog/','/preview/science/']){const page=await load(route,width);check(page.documentElement.scrollWidth<=frame.contentWindow.innerWidth,route+' fits '+width);}
 }
 }
 qaStatus.textContent=results.length+' PASS · 0 failures. Native touch devices and production authentication not verified.';document.querySelector('#show').click();
})().catch(error=>{qaStatus.textContent='FAILED: '+error.message;console.error(error);});
</script></html>
